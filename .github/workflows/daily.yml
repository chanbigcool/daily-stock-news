name: Daily Stock News Report

on:
  # 代码推送即触发构建：本人 push main 立即重建（GITHUB_TOKEN 的自动提交不触发，不会死循环）。
  push:
    branches: [main]
  # ⚠️ 定时抓取已停用（2026-10-13 迁移到新账号 chanbigcool 时关闭）：旧账号 cc5207597-hash
  # 被封的依据正是「在 Actions 里定时抓第三方站点」这个架构形态，不是代码质量。新账号另起一套
  # 同样的定时抓取会被判为规避封禁并做账号关联。确认要继续跑、且接受这个风险，再取消注释。
  # schedule:
  #   # 三时段兜底：GitHub Actions 的 schedule 会漂移/跳过，多时段互为备份。
  #   # 01:00 UTC = 北京 09:00；04:30 UTC = 北京 12:30；12:00 UTC = 北京 20:00。
  #   - cron: '0 1 * * *'
  #   - cron: '30 4 * * *'
  #   - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      # 公网一键刷新标识: 云端代理(SCF 云函数)传入的 runId,前端轮询 build-state.json
      # 用该值精确匹配"这一次"构建完成。定时构建无此 input → 写空串,不误配。
      run_id:
        description: 'Cloud refresh run id (internal)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  # 防止双时段或手动触发并发跑导致 push 冲突/gh-pages 互相覆盖
  group: daily-build
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 拉取完整 git 历史，构建产物提交回 main 时不会触发深层 clone 限制
          fetch-depth: 0

      # 并发 run 由 concurrency 组串行（group: daily-build），但每个 run 仍从**触发它的那个
      # SHA** 检出。2026-10-14 实测：双推触发出两班 run，各自基于旧 tip 提交，后跑完的那个
      # `git push origin main` 必然 non-fast-forward 被拒 → run 变红、站点拿不到这一版。
      # 构建前对齐到 main 当前 tip 即可 —— 此时 concurrency 已把本 run 排在前一个之后，
      # origin/main 就是最新的。**必须放在构建之前**：提交之后再 rebase，是把我们的 commit
      # 重放到别人的 commit 上，而两边改的是同一批产物文件（index.html / history/），必然冲突。
      # 用 `checkout -B` 而不是 `reset --hard`：checkout 动作可能落在 detached HEAD 上，
      # 那样后面 `git push origin main` 推的是陈旧的本地 main 引用。
      - name: 对齐到 main 最新提交
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 单元测试前置门槛(2026-10-14)。此前全仓 200 个用例从未在 CI 跑过 —— 唯一的检查
      # 是「构建产物有没有变化」,而那对代码回归完全无感。测试不过就不构建、不部署,
      # 避免把回归带上线。真正的产出闸门仍是下面的 push-gate(空报告不推),两者各管一头。
      #
      # 用 --experimental-test-isolation=none 关掉测试运行器的子进程隔离,是实测结论:
      # 默认每个测试文件起一个子进程、靠 IPC 回传结果,子进程的 stdout 与二进制结果帧
      # 挤同一根管道,输出量一大就脱同步 → 'Unable to deserialize cloned data'
      # (上游 nodejs/node#64061),届时整个文件算失败,看着像真回归。这条 bug 是时序敏感的
      # 间歇性问题 —— 本机 Node 22/24 各跑数遍都全绿,但 CI 上两次都撞上。
      # 关掉隔离后没有 IPC 通道,该 bug 在原理上不可能发生;代价是所有文件共用一个进程
      # (用例里的 global.fetch / CONFIG 改动都自行还原,实测两种 Node 版本均 200/200)。
      # 本地同口径跑法见 package.json 的 npm test。
      #
      # 注意 Node 22 只认 --experimental-test-isolation,Node 24 才有 --test-isolation
      # 别名;这里写的是两个版本都接受的那个名字。
      - name: Run unit tests
        run: npm test

      # ── 阶段一：手动刷新先发纯关键词简报(无 AI, ~2-3 分钟),用户立刻有东西看 ──
      # 只对**手动刷新**生效(workflow_dispatch 云端刷新)。2026-10-13 起 push 触发也不再
      # 跑阶段一 —— push 的常态来源是桌面定时任务的自动提交,没人盯着看简报,却要为它多
      # 付一次提交+推送+部署。定时构建同样直接走阶段二。收窄后一次 run 只推一个 commit。
      # best-effort: preview 失败不阻断 AI 正式构建;其 Commit/Deploy 由 outcome 守卫。
      - name: Build preview (关键词简报)
        id: build_preview
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          BUILD_PHASE: preview
          ANTHROPIC_API_KEY: ''
          RUN_ID: ${{ github.event.inputs.run_id || '' }}
        run: node scripts/build-daily.mjs

      # 推送闸门:空报告不提交、不发布。判定见 scripts/push-gate.mjs(读 build-state.json
      # 的 funnel)。拦下不判红 —— 那是一次合法结论,只打 notice,别再制造新的假告警。
      - name: 推送闸门 (预览阶段)
        id: gate_preview
        if: steps.build_preview.outcome == 'success'
        run: |
          if node scripts/push-gate.mjs; then
            echo "worth_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "worth_push=false" >> "$GITHUB_OUTPUT"
            echo "::notice::预览阶段当日 0 条新闻(空报告),跳过提交与发布"
          fi

      - name: Commit preview to main
        if: github.event_name == 'workflow_dispatch' && steps.build_preview.outcome == 'success' && steps.gate_preview.outputs.worth_push == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html history/ quality/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "日报自动构建(preview): $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin main
          fi

      # gh-pages 部署用独立暂存目录而非仓库根目录: peaceiris 对 publish_dir 为
      # '.' 时会重建工作区 .git 指向 gh-pages,导致阶段二的 AI 提交步骤报
      # "fatal: not in a git directory"。
      - name: Stage preview site for gh-pages
        if: github.event_name == 'workflow_dispatch' && steps.build_preview.outcome == 'success' && steps.gate_preview.outputs.worth_push == 'true'
        run: |
          rm -rf deploy-stage
          mkdir -p deploy-stage
          cp -r index.html db.html history quality assets deploy-stage/

      - name: Deploy preview to gh-pages
        if: github.event_name == 'workflow_dispatch' && steps.build_preview.outcome == 'success' && steps.gate_preview.outputs.worth_push == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: 'deploy-stage'
          publish_branch: gh-pages
          force_orphan: true

      - name: Clean preview stage
        if: github.event_name == 'workflow_dispatch' && steps.build_preview.outcome == 'success' && steps.gate_preview.outputs.worth_push == 'true'
        run: rm -rf deploy-stage

      - name: Deploy preview to EdgeOne Pages (国内镜像)
        if: github.event_name == 'workflow_dispatch' && steps.build_preview.outcome == 'success' && steps.gate_preview.outputs.worth_push == 'true' && env.EDGEONE_PAGES_API_TOKEN != ''
        continue-on-error: true
        env:
          EDGEONE_PAGES_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: npx edgeone makers deploy . --name daily-stock-news --area global --json

      # ── 阶段二：AI 研判正式构建(AI_BUDGET_MS 预算封顶),完成后覆盖部署,前端自动刷新 ──
      - name: Build AI report
        env:
          BUILD_PHASE: ai
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          RUN_ID: ${{ github.event.inputs.run_id || '' }}
        run: node scripts/build-daily.mjs

      # 推送闸门:空报告不提交、不发布。放在提交之前 —— 这是全流程唯一按**产出**判定的关卡
      # (下面的 `git diff --cached --quiet` 只认零字节差异,空报告与好报告在它眼里一样)。
      - name: 推送闸门 (AI 阶段)
        id: gate
        run: |
          if node scripts/push-gate.mjs; then
            echo "worth_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "worth_push=false" >> "$GITHUB_OUTPUT"
            echo "::notice::当日 0 条新闻(空报告),跳过提交与发布,线上站点保持上次内容"
          fi

      - name: Commit AI artifacts to main
        if: steps.gate.outputs.worth_push == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html history/ quality/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "日报自动构建: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin main
          fi

      - name: Stage AI site for gh-pages
        if: steps.gate.outputs.worth_push == 'true'
        run: |
          rm -rf deploy-stage
          mkdir -p deploy-stage
          cp -r index.html db.html history quality assets deploy-stage/

      - name: Deploy AI to gh-pages branch
        if: steps.gate.outputs.worth_push == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: 'deploy-stage'
          publish_branch: gh-pages
          force_orphan: true

      - name: Clean AI stage
        run: rm -rf deploy-stage

      # 国内镜像:EdgeOne Pages(腾讯,国内节点)。
      # 未配置 EDGEONE_API_TOKEN 前自动跳过,不影响 gh-pages 主部署。
      # 首次部署会自动创建 daily-stock-news 项目并分配默认免费域名。
      - name: Deploy AI to EdgeOne Pages (国内镜像)
        if: steps.gate.outputs.worth_push == 'true' && env.EDGEONE_PAGES_API_TOKEN != ''
        continue-on-error: true
        env:
          EDGEONE_PAGES_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: npx edgeone makers deploy . --name daily-stock-news --area global --json

      # ── 抓取健康闸门：放在 Deploy 之后，先发布再判红 ──
      # 坏数据日照常更新站点(不整站冻结,心跳工作流照常补建),但 run 变红 →
      # GitHub 邮件告警。判定逻辑见 pipeline/health.mjs,结果写在 build-state.json。
      - name: Fetch health gate
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const p = "history/build-state.json";
            if (!fs.existsSync(p)) { console.log("无 build-state.json，跳过健康闸门"); process.exit(0); }
            const h = (JSON.parse(fs.readFileSync(p, "utf8")).health) || { level: "ok", issues: [] };
            const detail = (h.issues || []).join("；");
            if (h.level === "failed") {
              console.error("::error::抓取健康判定为 failed — " + detail);
              process.exit(1);
            }
            if (h.level === "degraded") console.warn("::warning::抓取降级 — " + detail);
            console.log("抓取健康: " + h.level + (detail ? " — " + detail : ""));
          '
