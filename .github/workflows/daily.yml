name: Daily Stock News Report

on:
  # 代码推送即触发构建：本人 push main 立即重建（GITHUB_TOKEN 的自动提交不触发，不会死循环）。
  push:
    branches: [main]
  schedule:
    # 三时段兜底：GitHub Actions 的 schedule 会漂移/跳过，多时段互为备份。
    # 01:00 UTC = 北京 09:00；04:30 UTC = 北京 12:30；12:00 UTC = 北京 20:00。
    - cron: '0 1 * * *'
    - cron: '30 4 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      # 公网一键刷新标识: 云端代理(SCF 云函数)传入的 runId,前端轮询 build-state.json
      # 用该值精确匹配"这一次"构建完成。定时构建无此 input → 写空串,不误配。
      run_id:
        description: 'Cloud refresh run id (internal)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  # 防止双时段或手动触发并发跑导致 push 冲突/gh-pages 互相覆盖
  group: daily-build
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 拉取完整 git 历史，构建产物提交回 main 时不会触发深层 clone 限制
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 阶段一：手动刷新先发纯关键词简报(无 AI, ~2-3 分钟),用户立刻有东西看 ──
      # 只对手动触发生效(workflow_dispatch 云端刷新 / push);定时构建直接走阶段二,不白耗 runner。
      # best-effort: preview 失败不阻断 AI 正式构建;其 Commit/Deploy 由 outcome 守卫。
      - name: Build preview (关键词简报)
        id: build_preview
        if: github.event_name != 'schedule'
        continue-on-error: true
        env:
          BUILD_PHASE: preview
          ANTHROPIC_API_KEY: ''
          RUN_ID: ${{ github.event.inputs.run_id || '' }}
        run: node scripts/build-daily.mjs

      - name: Commit preview to main
        if: steps.build_preview.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html history/ quality/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "日报自动构建(preview): $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin main
          fi

      # gh-pages 部署用独立暂存目录而非仓库根目录: peaceiris 对 publish_dir 为
      # '.' 时会重建工作区 .git 指向 gh-pages,导致阶段二的 AI 提交步骤报
      # "fatal: not in a git directory"。
      - name: Stage preview site for gh-pages
        if: steps.build_preview.outcome == 'success'
        run: |
          rm -rf deploy-stage
          mkdir -p deploy-stage
          cp -r index.html history quality deploy-stage/

      - name: Deploy preview to gh-pages
        if: steps.build_preview.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: 'deploy-stage'
          publish_branch: gh-pages
          force_orphan: true

      - name: Clean preview stage
        if: steps.build_preview.outcome == 'success'
        run: rm -rf deploy-stage

      - name: Deploy preview to EdgeOne Pages (国内镜像)
        if: steps.build_preview.outcome == 'success' && env.EDGEONE_PAGES_API_TOKEN != ''
        continue-on-error: true
        env:
          EDGEONE_PAGES_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: npx edgeone makers deploy . --name daily-stock-news --area global --json

      # ── 阶段二：AI 研判正式构建(AI_BUDGET_MS 预算封顶),完成后覆盖部署,前端自动刷新 ──
      - name: Build AI report
        env:
          BUILD_PHASE: ai
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          RUN_ID: ${{ github.event.inputs.run_id || '' }}
        run: node scripts/build-daily.mjs

      - name: Commit AI artifacts to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html history/ quality/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "日报自动构建: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin main
          fi

      - name: Stage AI site for gh-pages
        run: |
          rm -rf deploy-stage
          mkdir -p deploy-stage
          cp -r index.html history quality deploy-stage/

      - name: Deploy AI to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: 'deploy-stage'
          publish_branch: gh-pages
          force_orphan: true

      - name: Clean AI stage
        run: rm -rf deploy-stage

      # 国内镜像:EdgeOne Pages(腾讯,国内节点)。
      # 未配置 EDGEONE_API_TOKEN 前自动跳过,不影响 gh-pages 主部署。
      # 首次部署会自动创建 daily-stock-news 项目并分配默认免费域名。
      - name: Deploy AI to EdgeOne Pages (国内镜像)
        if: env.EDGEONE_PAGES_API_TOKEN != ''
        continue-on-error: true
        env:
          EDGEONE_PAGES_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: npx edgeone makers deploy . --name daily-stock-news --area global --json
